[project]
name = "claw-brain"
version = "0.1.0"
description = "Claw-brain: autonomous money-making system with AI decision engine"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "cryptography>=41.0.0",
    "chromadb>=1.5.0",
]

[project.scripts]
claw-brain = "cli:app"
